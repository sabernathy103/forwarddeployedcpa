# Netlify config — no build step; this is a static site.
[build]
  publish = "."

# Nice-to-have security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/writing"
  to = "/writing/"
  status = 301
